name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files --error-unmatch README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md .clang-format .gitignore

  host:
    name: host checks (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy python3-matplotlib
      - name: Configure
        run: |
          extra=""
          if [ "${{ matrix.config }}" = "sanitize" ]; then extra="-DCMAKE_BUILD_TYPE=Debug -DAP_SANITIZE=ON"; fi
          cmake -S . -B build -G Ninja $extra
      - name: Build
        run: cmake --build build
      - name: Unit tests (C++)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests (protocol, simulator, closed-loop SIL)
        run: cd sim && python3 -m unittest discover -s tests -v

  firmware:
    name: STM32 drivers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          v=13.3.1-1.1
          curl -sSL -o tc.tar.gz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz
          tar xf tc.tar.gz
          echo "$PWD/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"
      - name: Configure board drivers
        run: >
          cmake -S firmware -B build-fw -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$PWD/firmware/cmake/arm-none-eabi.cmake
      - name: Compile board drivers
        run: cmake --build build-fw --target board_drivers
